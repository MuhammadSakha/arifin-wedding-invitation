<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arifin & Ajeng Wedding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sacramento&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Simply Countdown -->
    <link rel="stylesheet" href="countdown/default.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section id="hero"
        class="hero w-100 h-100 p-3 mx-auto text-center d-flex justify-content-center align-items-center ">
        <main>
            <h4>Kepada Bapak/Ibu/Saudara/i,</h4>
            <h1>Arifin & Ajeng</h1>
            <p>Akan melangsungkan resepsi pernikahan dalam:</p>
            <div class="simply-countdown"></div>
            <a href="#undangan" class="btn btn-lg mt-4">Lihat Undangan</a>
        </main>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <!-- JS Countdown -->
    <script src="countdown/simplyCountdown.umd.js"></script>

    <!-- Script inisialisasi -->
    <script>
        simplyCountdown('.simply-countdown', {
            year: 2026,
            month: 12,
            day: 31,
            hours: 8,
            words: {
                days: { lambda: (root, n) => (n > 1 ? 'Hari' : 'Hari'), root: 'Hari' },
                hours: { lambda: (root, n) => (n > 1 ? 'Jam' : 'Jam'), root: 'Jam' },
                minutes: { lambda: (root, n) => (n > 1 ? 'Menit' : 'Menit'), root: 'Menit' },
                seconds: { lambda: (root, n) => (n > 1 ? 'Detik' : 'Detik'), root: 'Detik' }
            }
        });
    </script>

</body>

</html>
